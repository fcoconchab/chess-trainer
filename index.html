button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}

.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ── App frame ── */

#hdr .back{width:40px;height:40px;margin-left:-8px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;line-height:1}
#hdr .back:active{background:var(--card-2)}
#hdr h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .meta{font-size:.85rem;color:var(--ink-soft);white-space:nowrap}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sab) + 16px)}
.tabbar{display:flex;border-top:1px solid var(--rule);background:var(--card);padding-bottom:var(--sab)}
.tabbar button{flex:1;padding:9px 0 8px;font-size:.68rem;font-weight:500;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--err);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:1.5}
.tabbar.drill{display:none}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 10px}
.progress i{display:block;height:100%;background:var(--frame);transition:width .25s}

/* ── Board ── */
.board-wrap{position:relative;background:var(--frame);border-radius:6px;padding:6px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.14);margin-bottom:10px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;width:100%;

.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.lt{background:var(--sq-light)}.sq.dk{background:var(--sq-dark)}
.sq .c{position:absolute;font-size:.55rem;font-weight:600;line-height:1;opacity:.75;pointer-events:none}
.sq .c.r{top:2px;left:3px}.sq .c.f{bottom:1px;right:3px}
.sq.lt .c{color:var(--sq-dark)}.sq.dk .c{color:var(--sq-light)}
.sq::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}

.sq.sel::after{background:var(--mark);opacity:.6}
.sq.good::after{background:var(--ok);opacity:.55}
.sq.bad::after{background:var(--err);opacity:.55}
.sq.target::after{background:var(--mark);opacity:.35;box-shadow:inset 0 0 0 3px var(--mark)}
.sq.att::after{opacity:1;box-shadow:inset 0 0 0 4px var(--ok)}
.sq.def::after{opacity:1;box-shadow:inset 0 0 0 4px var(--err)}
.sq.dot::before{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(0,0,0,.28);z-index:2;pointer-events:none}
.sq.cap::before{content:"";position:absolute;inset:0;border:5px solid rgba(0,0,0,.28);border-radius:50%;z-index:2;pointer-events:none;background:none;width:auto;height:auto}
.pc{position:absolute;inset:0;background-size:88% 88%;background-position:center;background-repeat:no-repeat;z-index:1;pointer-events:none;will-change:transform}
.pc.moving{transition:transform .18s ease}
.drag{position:fixed;width:60px;height:60px;background-size:contain;background-repeat:no-repeat;pointer-events:none;z-index:50;transform:translate(-50%,-55%)}
.board.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.board-foot{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink-soft);margin:-4px 0 8px;min-height:20px}
.board-foot b{color:var(--ink);font-weight:600}

.ctx{font-size:.8rem;color:var(--ink-soft);margin-bottom:3px}

.ask small{display:block;font-size:.85rem;font-weight:400;color:var(--ink-soft);margin-top:2px}
.verdict h3{font-size:1.05rem;font-weight:700}
.verdict p{font-size:.92rem;margin-top:4px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 14px;min-height:48px;text-align:left;font-weight:500;font-size:1rem}

.opt .k{font-size:.72rem;color:var(--ink-soft);border:1px solid var(--rule);border-radius:5px;padding:1px 6px;font-weight:600}

.act:active{filter:brightness(1.12)}
.row{display:flex;gap:8px}
.row .act{flex:1}

.h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:10px}

.card h3{font-size:1.05rem;font-weight:700;margin-bottom:2px}

.tiny{font-size:.8rem;color:var(--ink-soft)}

    { k: "contar", run: next => startDeck("contar", { n: 4, onDone: next }) },
    { k: "line", run: next => startLine(od, { onDone: next }) },
    { k: "remates", run: next => { const r = Math.random(); startDeck(r < .5 ? "remates" : r < .75 ? "mate2" : "defiende", { n: 3, onDone: next }); } }
  ];
  if (due.length) parts.push({ k: "errores", run: next => startReview({ onDone: next }) });
  session = { t0: Date.now(), i: 0, parts, results: [] };
  const tick = setInterval(() => { if (!session) { clearInterval(tick); return; } const m = $("hdrMeta"); if (m) m.textContent = m.textContent.replace(/\d\d:\d\d$/, sessionClock()); }, 1000);
  sessionNext();
}
function sessionNext(res) {
  if (!session) return;
  if (res) session.results.push(res);
  if (session.i >= session.parts.length) { sessionFinish(); return; }
  const part = session.parts[session.i++];
  part.run(sessionNext);
}
function sessionFinish() {
  const s = session; session = null; run = null; line = null;
  const d = dayRec(); d.s++; save();
  const secs = Math.floor((Date.now() - s.t0) / 1000);
  const tot = s.results.reduce((a, r) => a + (r.total || 0), 0), ok = s.results.reduce((a, r) => a + (r.ok || 0), 0);
  scr = { name: "sessiondone", secs, tot, ok, st: streak() }; render();
}
SCREENS.sessiondone = v => {
  header("Sesión terminada", { back: () => go("hoy") }); beep("done");
  const { secs, tot, ok, st } = scr;
  v.innerHTML = '<div class="card big" style="margin-top:8px;text-align:center"><div class="big-n">' + ok + "/" + tot + '</div><div class="tiny" style="margin-top:4px">posiciones acertadas a la primera · ' + fmtClock(secs) + "</div></div>" +
    '<div class="card"><div class="kv"><span>Racha</span><b>' + st + (st === 1 ? " día" : " días") + '</b></div><div class="kv"><span>Ahora</span><b>una partida de 10 min en Lichess</b></div><div class="kv"><span>Si pierdes material</span><b>guarda la posición en Errores</b></div></div>' +
    '<button class="act" id="ok">Listo</button>';
  $("ok").onclick = () => go("hoy");
};

/* ═══════════ MIS ERRORES ═══════════ */
const CATS = [["suelta", "Pieza suelta"], ["tactica", "Táctica no vista"], ["reloj", "Error de reloj"], ["plan", "Error de plan"]];
const STEPS = [1, 3, 7, 16, 35];
const dueCards = () => S.cards.filter(c => (c.due || 0) <= Date.now());
function schedule(c, ok) {
  if (ok) { c.box = Math.min((c.box || 0) + 1, STEPS.length); c.due = Date.now() + STEPS[c.box - 1] * DAY; c.reps = (c.reps || 0) + 1; }
  else { c.box = 0; c.due = Date.now(); c.lapses = (c.lapses || 0) + 1; }
  save();
}
function dueLabel(c) { const d = (c.due || 0) - Date.now(); if (d <= 0) return "hoy"; const n = Math.ceil(d / DAY); return "en " + n + (n === 1 ? " día" : " días"); }
SCREENS.errores = v => {
  header("Mis errores");
  const due = dueCards();
  v.innerHTML = '<div class="h2">Tus posiciones</div><div class="sub">Donde perdiste material de verdad. Vuelven a los 1, 3, 7, 16 y 35 días.</div>' +
    '<div class="row" style="margin-bottom:12px"><button class="act" id="rev"' + (due.length ? "" : " disabled style=\"opacity:.5\"") + ">Repasar" + (due.length ? " (" + due.length + ")" : "") + '</button><button class="act sec" id="add">Añadir</button></div>' +
    (S.cards.length ? S.cards.slice().sort((a, b) => (a.due || 0) - (b.due || 0)).map((c, i) => '<div class="item" style="cursor:default"><div class="t"><b>' + esc((CATS.find(x => x[0] === c.cat) || ["", "Error"])[1]) + " · " + esc(c.san || (c.from + c.to)) + '</b><span>' + esc(c.note || (c.orient === "w" ? "blancas" : "negras")) + '</span></div><span class="n">' + dueLabel(c) + '</span><button class="back" data-del="' + c.id + '" aria-label="Borrar" style="margin:0;font-size:1.1rem;color:var(--ink-soft)">✕</button></div>').join("") :
      '<div class="card"><p>Todavía no hay ninguna. Después de una partida perdida, abre el análisis en Lichess, pega el enlace de la partida aquí y marca la jugada que debiste hacer.</p></div>');
  $("rev").onclick = () => startReview();
  $("add").onclick = () => startCompose();
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (confirm("¿Borrar esta posición?")) { S.cards = S.cards.filter(c => c.id !== b.dataset.del); save(); render(); } });
};
function startReview(opts) {
  opts = opts || {};
  const due = shuffle(dueCards()); if (!due.length) { toast("Nada para hoy"); return; }
  const items = due.map(c => ({ id: "card:" + c.id, fen: c.fen, orient: c.orient, line: "Tu partida", card: c,
    steps: [{ kind: "move", ask: "¿Cuál era la jugada correcta?", hint: (CATS.find(x => x[0] === c.cat) || ["", ""])[1], sols: [{ from: c.from, to: c.to, san: c.san || c.from + "-" + c.to }], why: c.note || "" }] }));
  startDeck("errores", { deck: { title: "Mis errores", items }, items, onDone: r => { if (opts.onDone) opts.onDone(r); else { scr = { name: "deckdone", r: Object.assign({ key: "errores", title: "Mis errores", misses: [] }, r) }; render(); } } });
}
// al terminar cada tarjeta, reprograma
const _finishStep = finishStep;
finishStep = function (ok, title, text, extra) {
  if (run && run.key === "errores") { const it = curItem(); if (it.card) schedule(it.card, ok && run.attempts === 0); }
  return _finishStep(ok, title, text, extra);
};

/* ── Añadir una posición ── */
function startCompose() { comp = { stage: "src", fen: null, orient: "w", from: null, to: null, san: null, cat: "suelta", note: "", pgnMoves: null, ch: null }; go("compose"); }
SCREENS.compose = v => {
  const C = comp;
  header("Nueva posición", { back: () => { if (C.stage === "src") { comp = null; go("errores"); } else { C.stage = C.stage === "pick" ? "src" : C.stage === "move" ? (C.pgnMoves ? "pick" : "src") : "move"; render(); } } });
  if (C.stage === "src") {
    v.innerHTML = '<div class="card"><h3>Desde una partida de Lichess</h3><p>Pega el enlace de la partida. Elegirás la jugada donde te equivocaste.</p><input type="text" id="url" placeholder="https://lichess.org/abcd1234" inputmode="url" autocapitalize="off" autocorrect="off"><button class="act" id="fetch">Cargar partida</button><p class="tiny" id="fetchMsg" style="margin-top:8px"></p></div>' +
      '<div class="card"><h3>O pega un FEN</h3><p>En Lichess: Análisis › pestaña FEN &amp; PGN.</p><textarea id="fen" placeholder="rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1" autocapitalize="off" autocorrect="off"></textarea>' +
      '<div class="seg" id="col"><button data-c="w" aria-pressed="true">Juego con blancas</button><button data-c="b" aria-pressed="false">con negras</button></div><button class="act sec" id="useFen">Usar esta posición</button></div>';
    $("col").querySelectorAll("button").forEach(b => b.onclick = () => { C.orient = b.dataset.c; $("col").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("useFen").onclick = () => { const f = $("fen").value.trim(); try { const ch = new Chess(f); C.ch = ch; C.fen = ch.fen(); C.stage = "move"; render(); } catch (e) { toast("Ese FEN no es válido"); } };
    $("fetch").onclick = async () => {
      const m = /lichess\.org\/([A-Za-z0-9]{8})/.exec($("url").value) || /^([A-Za-z0-9]{8})/.exec($("url").value.trim());
      if (!m) { toast("No encuentro el identificador de la partida"); return; }
      $("fetchMsg").textContent = "Cargando…";
      try {
        const r = await fetch("https://lichess.org/game/export/" + m[1] + "?clocks=false&evals=false&opening=false", { headers: { Accept: "application/x-chess-pgn" } });
        if (!r.ok) throw new Error(r.status);
        const pgn = await r.text();
        const ch = new Chess(); ch.loadPgn(pgn);
        const hist = ch.history({ verbose: true }); if (!hist.length) throw new Error("vacía");
        const hdr = ch.header ? ch.header() : {};
        C.pgnMoves = hist; C.pgnHeader = hdr; C.stage = "pick"; render();
      } catch (e) { $("fetchMsg").textContent = "No se pudo cargar (" + (e.message || e) + "). Si la partida es privada o no hay conexión, usa el FEN."; }
    };
    return;
  }
  if (C.stage === "pick") {
    const H = C.pgnHeader || {};
    v.innerHTML = '<div class="card"><h3>' + esc((H.White || "Blancas") + " – " + (H.Black || "Negras")) + '</h3><p>Toca la jugada que hiciste mal. Cargaré la posición justo antes de esa jugada.</p></div>' +
      '<div class="moves" id="mv">' + C.pgnMoves.map((m, i) => (i % 2 === 0 ? '<span class="mv num">' + (i / 2 + 1) + ".</span>" : "") + '<button class="mv mono" data-i="' + i + '">' + esc(m.san) + "</button>").join("") + "</div>";
    v.querySelectorAll("button.mv").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i); const ch = new Chess(); for (let j = 0; j < i; j++) ch.move(C.pgnMoves[j].san);
      C.ch = ch; C.fen = ch.fen(); C.orient = C.pgnMoves[i].color; C.played = C.pgnMoves[i].san; C.stage = "move"; render();
    });
    return;
  }
  if (C.stage === "move") {
    v.innerHTML = '<div id="boardHost"></div><div class="board-foot"><span>Juegas con <b>' + (C.orient === "w" ? "blancas" : "negras") + "</b></span><span>" + (C.played ? "jugaste " + esc(C.played) : "") + '</span></div><div class="panel" id="panel"><div class="ctx">Paso 2 de 3</div><div class="ask">Mueve la jugada que debiste hacer<small>Arrastra o toca origen y destino.</small></div></div><div id="act"></div>';
    Board.mount($("boardHost")); Board.set(C.fen, C.orient);
    const ch = C.ch; const legal = ch ? ch.moves({ verbose: true }) : [];
    Board.setMode("move", { canPick: sq => { const p = Board.pieceAt(sq); return !!p && p[0] === C.orient; }, targetsOf: sq => legal.filter(m => m.from === sq).map(m => m.to), onMove: (f, t) => {
      const m = legal.find(x => x.from === f && x.to === t); if (!m && legal.length) { Board.shake(); toast("Esa jugada no es legal"); return; }
      C.from = f; C.to = t; C.san = m ? m.san : f + t; Board.setMarks({ good: [f, t] }); Board.setMode("none");
      $("panel").className = "panel good"; $("panel").innerHTML = '<div class="verdict"><h3>' + esc(C.san) + "</h3><p>Esta será la respuesta correcta.</p></div>";
      $("act").innerHTML = '<div class="row"><button class="act sec" id="undo">Cambiar</button><button class="act" id="next">Siguiente</button></div>';
      $("undo").onclick = () => render(); $("next").onclick = () => { C.stage = "tag"; render(); };
    } });
    return;
  }
  if (C.stage === "tag") {
    v.innerHTML = '<div class="card"><h3>Paso 3 de 3 · ¿Qué tipo de error fue?</h3><div class="chips" id="cats" style="margin-top:10px">' + CATS.map(c => '<button class="chip" data-c="' + c[0] + '" aria-pressed="' + (C.cat === c[0]) + '">' + c[1] + "</button>").join("") + "</div>" +
      '<textarea id="note" placeholder="Una frase para acordarte. Ej: dejé el alfil sin defensa después de enrocar."></textarea><button class="act" id="saveCard">Guardar posición</button></div>';
    $("cats").querySelectorAll(".chip").forEach(b => b.onclick = () => { C.cat = b.dataset.c; $("cats").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("saveCard").onclick = () => {
      S.cards.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), fen: C.fen, orient: C.orient, from: C.from, to: C.to, san: C.san, cat: C.cat, note: $("note").value.trim(), box: 0, due: Date.now(), created: Date.now() });
      save(); comp = null; toast("Guardada. Ya puedes repasarla."); go("errores");
    };
  }
};

/* ═══════════ ARRANQUE ═══════════ */
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { const n = $("next"); if (n) n.click(); }
  if (/^[1-4]$/.test(e.key)) { const o = document.querySelectorAll("#opts .opt")[Number(e.key) - 1]; if (o && !o.disabled) o.click(); }
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
render();

</script>
