/* ── App frame ── */

#hdr .back{width:40px;height:40px;margin-left:-8px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;line-height:1}
#hdr .back:active{background:var(--card-2)}
#hdr h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .meta{font-size:.85rem;color:var(--ink-soft);white-space:nowrap}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--sab) + 16px)}
.tabbar{display:flex;border-top:1px solid var(--rule);background:var(--card);padding-bottom:var(--sab)}

.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--err);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:1.5}
.tabbar.drill{display:none}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 10px}
.progress i{display:block;height:100%;background:var(--frame);transition:width .25s}

/* ── Board ── */
.board-wrap{position:relative;background:var(--frame);border-radius:6px;padding:6px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.14);margin-bottom:10px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;width:100%;

.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.lt{background:var(--sq-light)}.sq.dk{background:var(--sq-dark)}

.sq.lt .c{color:var(--sq-dark)}.sq.dk .c{color:var(--sq-light)}
.sq::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}

.sq.sel::after{background:var(--mark);opacity:.6}
.sq.good::after{background:var(--ok);opacity:.55}
.sq.bad::after{background:var(--err);opacity:.55}
.sq.target::after{background:var(--mark);opacity:.35;box-shadow:inset 0 0 0 3px var(--mark)}
.sq.att::after{opacity:1;box-shadow:inset 0 0 0 4px var(--ok)}
.sq.def::after{opacity:1;box-shadow:inset 0 0 0 4px var(--err)}
.sq.dot::before{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(0,0,0,.28);z-index:2;pointer-events:none}
.sq.cap::before{content:"";position:absolute;inset:0;border:5px solid rgba(0,0,0,.28);border-radius:50%;z-index:2;pointer-events:none;background:none;width:auto;height:auto}
.pc{position:absolute;inset:0;background-size:88% 88%;background-position:center;background-repeat:no-repeat;z-index:1;pointer-events:none;will-change:transform}
.pc.moving{transition:transform .18s ease}
.drag{position:fixed;width:60px;height:60px;background-size:contain;background-repeat:no-repeat;pointer-events:none;z-index:50;transform:translate(-50%,-55%)}
.board.shake{animation:shake .35s}

.board-foot{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink-soft);margin:-4px 0 8px;min-height:20px}

.verdict h3{font-size:1.05rem;font-weight:700}
.verdict p{font-size:.92rem;margin-top:4px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 14px;min-height:48px;text-align:left;font-weight:500;font-size:1rem}

.row{display:flex;gap:8px}
.row .act{flex:1}

.sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:10px}

.card h3{font-size:1.05rem;font-weight:700;margin-bottom:2px}

.big-n{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1}

.tiny{font-size:.8rem;color:var(--ink-soft)}

ones). Con menos piezas en el tablero, tu pieza de más pesa más y el rival tiene menos con qué complicar.","steps":[{"kind":"choice","ask":"Tienes un caballo de más. ¿Qué haces con las damas?","hint":"Menos piezas, menos peligro.","options":[{"k":"si","label":"Cambio: Qxd6"},{"k":"no","label":"Las mantengo para atacar"}],"answer":"si","att":["d3"],"def":["c7"],"why":"Qxd6 cxd6 deja un final de caballo contra nada: ganado sin riesgo. Con damas, el rival aún puede buscar jaques y trucos. Ojo: cambiar piezas sí, cambiar peones no, porque los peones son los que coronan."}],"title":"Con ventaja, cambia piezas","sub":"Medio juego · Si vas ganando material, cambia piezas (no peones). Con menos piezas en el tablero, tu pieza de más pesa más y el rival tiene menos con qué complicar.","line":"Medio juego"},{"id":"cpt_rey","fen":"6k1/ppp5/8/8/8/8/PPP5/6K1 w - - 0 1","orient":"w","tag":"Rey activo en el final","phase":"Final","target":"g1","concept":"En el final, con pocas piezas, el rey deja de esconderse y se convierte en una pieza de ataque. El primero que lleva su rey al centro suele ganar.","steps":[{"kind":"choice","ask":"Final de peones. ¿Cuál es tu primer plan?","hint":"Piensa qué pieza está sin usar.","options":[{"k":"rey","label":"Llevar el rey al centro"},{"k":"peon","label":"Avanzar mis peones ya"}],"answer":"rey","att":[],"def":[],"why":"Kf2-e3-d4 activa la pieza más fuerte del final. Los peones se empujan después, apoyados por el rey. Si corres con los peones sin el rey, el rey rival se los come."}],"title":"Rey activo en el final","sub":"Final · En el final, con pocas piezas, el rey deja de esconderse y se convierte en una pieza de ataque. El primero que lleva su rey al centro suele ganar.","line":"Final"},{"id":"cpt_cuadrado","fen":"8/8/8/P4k2/8/8/8/7K b - - 0 1","orient":"b","tag":"Regla del cuadrado","phase":"Final","target":"a5","concept":"Dibuja un cuadrado desde el peón hasta su casilla de coronación. Si tu rey puede entrar en ese cuadrado con su jugada, lo alcanza. Si no, el peón corona.","steps":[{"kind":"choice","ask":"Juegan negras. ¿Tu rey alcanza al peón de a5?","hint":"El peón necesita 3 jugadas. Cuenta las tuyas.","options":[{"k":"si","label":"Sí, llega a tiempo"},{"k":"no","label":"No, corona"}],"answer":"no","att":[],"def":[],"why":"El cuadrado del peón va de a5 a d8. Tu rey en f5 está fuera y con una jugada solo llega a e5 o e6, todavía fuera. El peón corona. Si el rey estuviera en e5, entraría al cuadrado y lo pararía."}],"title":"Regla del cuadrado","sub":"Final · Dibuja un cuadrado desde el peón hasta su casilla de coronación. Si tu rey puede entrar en ese cuadrado con su jugada, lo alcanza. Si no, el peón corona.","line":"Final"},{"id":"cpt_oposicion","fen":"8/8/4k3/8/4KP2/8/8/8 b - - 0 1","orient":"b","tag":"La oposición","phase":"Final","concept":"Dos reyes frente a frente con una casilla en medio: el que NO tiene que mover gana la oposición. Defendiendo, mantén tu rey delante del peón y frente al rey rival.","steps":[{"kind":"move","ask":"Juegan negras. Solo una jugada aguanta el empate.","hint":"Quédate frente a su rey.","sols":[{"from":"e6","to":"f6","san":"Kf6"}],"why":"Kf6 se planta delante del peón y frente al rey blanco. Ahora, si f5+ juegas Kf7 y luego siempre frente al peón. Cualquier otra jugada deja pasar al rey blanco por d5 o f5 y el peón corona."}],"title":"La oposición","sub":"Final · Dos reyes frente a frente con una casilla en medio: el que NO tiene que mover gana la oposición. Defendiendo, mantén tu rey delante del peón y frente al rey rival.","line":"Final"}],"SEGURA":[{"id":"seg_6d6c0b7b","fen":"r1bqk2r/pppp1ppp/2n5/8/1bBPn3/5N2/PP1B1PPP/RN1QK2R w KQkq - 0 8","orient":"w","line":"Italiana","last":"Nxe4","mv":{"from":"d2","to":"b4","san":"Bxb4"},"safe":true,"why":"Segura: nada queda colgado y no abres tu rey. Es tu jugada de repertorio."},{"id":"seg_1cee4525","fen":"r1b1r1k1/pp3ppp/2n1pn2/q1bp4/2P2B2/P1N1P3/1PQN1PPP/3RKB1R b K - 4 11","orient":"b","line":"GDD","last":"Nd2","mv":{"fr /* ═══════════ RUNNER DE MAZOS ═══════════ */
function startDeck(key, opts) {
  opts = opts || {};
  const d = DECKS[key] || opts.deck;
  const items = opts.items || selectItems(d.items, opts.n || d.n);
  if (!items.length) { toast("No hay posiciones"); return; }
  run = { key, title: d.title, items, pos: 0, step: 0, answered: false, attempts: 0, ok: 0, total: 0, misses: [], onDone: opts.onDone || null, ch: null, extraSteps: null, timer: null, t0: Date.now(), time: 0 };
  go("drill");
}
function curItem() { return run.items[run.pos]; }
function curSteps() { return run.extraSteps || curItem().steps; }
function curStep() { return curSteps()[run.step]; }
SCREENS.drill = v => {
  const it = curItem(); const st = curStep();
  header(run.title, { back: () => exitDrill(), meta: (run.pos + 1) + "/" + run.items.length + (session ? "  " + sessionClock() : "") });
  v.innerHTML = '<div class="progress"><i style="width:' + ((run.pos + (run.step / curSteps().length)) / run.items.length * 100) + '%"></i></div>' +
    '<div id="boardHost"></div>' +
    '<div class="board-foot"><span>Juegas con <b>' + (it.orient === "w" ? "blancas" : "negras") + "</b>" + (it.last ? " · acaba de jugar <b class=\"mono\">" + esc(it.last) + "</b>" : "") + "</span><span>" + esc(it.line || it.tag || "") + "</span></div>" +
    '<div class="panel" id="panel"></div><div class="opts" id="opts"></div><div id="act"></div>';
  Board.mount($("boardHost"));
  if (run.step === 0 && !run.extraSteps) { run.ch = null; run.t0 = Date.now(); try { run.ch = new Chess(it.fen); } catch (e) { run.ch = null; } Board.set(it.fen, it.orient); }
  else Board.set(Board.getPos(), it.orient);
  if (it.target) Board.setMarks({ target: [it.target] });
  drillStep();
};
function drillStep() {
  const it = curItem(), st = curStep();
  run.answered = false; run.attempts = 0;
  $("panel").className = "panel";
  $("panel").innerHTML = '<div class="ctx">' + esc(st.ctx || (curSteps().length > 1 ? "Pregunta " + (run.step + 1) + " de " + curSteps().length : "")) + '</div><div class="ask">' + esc(st.ask) + (st.hint ? "<small>" + esc(st.hint) + "</small>" : "") + "</div>";
  $("act").innerHTML = "";
  const opts = $("opts"); opts.innerHTML = "";
  if (st.kind === "square") {
    Board.setMode("tap", { onTap: sq => judgeSquare(sq) });
    if (st.none) { const b = document.createElement("button"); b.className = "opt ghost"; b.textContent = st.none; b.onclick = () => judgeSquare(null); opts.appendChild(b); }
  } else if (st.kind === "choice") {
    Board.setMode("none");
    st.options.forEach((o, i) => { const b = document.createElement("button"); b.className = "opt"; b.innerHTML = '<span class="k">' + (i + 1) + "</span>" + esc(o.label); b.onclick = () => judgeChoice(o.k, b); opts.appendChild(b); });
  } else if (st.kind === "move") {
    const ch = run.ch; const my = it.orient;
    Board.setMode("move", {
      canPick: sq => { const p = Board.pieceAt(sq); return !!p && p[0] === my; },
      targetsOf: sq => ch ? ch.moves({ square: sq, verbose: true }).map(m => m.to) : [],
      onMove: (from, to) => judgeMove(from, to)
    });
  }
}
function finishStep(ok, title, text, extra) {
  run.answered = true;
  const p = $("panel"); p.className = "panel " + (ok ? "good" : "bad");
  p.innerHTML = '<div class="verdict"><h3>' + esc(title) + "</h3>" + (text ? "<p>" + esc(text) + "</p>" : "") + "</div>";
  $("opts").querySelectorAll("button").forEach(b => b.disabled = true);
  Board.setMode("none");
  beep(ok ? "ok" : "bad");
  const last = run.step + 1 >= curSteps().length && !(extra && extra.noCount);
  if (last) { run.total++; const ms = Date.now() - run.t0; run.time += ms; const clean = ok && run.attempts === 0; if (clean) run.ok++; logItem(curItem().id, clean, ms); if (!clean) run.misses.push({ it: curItem(), why: text }); }
  if (extra && extra.then) { extra.then(); return; }
  const label = last ? (run.pos + 1 >= run.items.length ? "Ver resultado" : "Siguiente") : "Siguiente pregunta";
  $("act").innerHTML = '<button class="act" id="next">' + label + "</button>";
  $("next").onclick = advance;
  if (ok && S.set.auto && run.attempts === 0) run.timer = setTimeout(() => { if (run && run.answered) advance(); }, last ? 1800 : 1400);
}
function advance() {
  if (!run) return; clearTimeout(run.timer);
  if (run.step + 1 < curSteps().length) { run.step++; render(); return; }
  run.extraSteps = null; run.step = 0; run.pos++;
  if (run.pos >= run.items.length) deckFinish(); else render();
}
function judgeSquare(sq) {
  if (run.answered) return;
  const st = curStep(); const it = curItem();
  const ok = (sq === st.answer) || (sq === null && st.answer === null);
  if (ok) { Board.setMarks(Object.assign({}, st.answer ? { good: [st.answer], att: st.att || [] } : {}, it.target ? { target: [it.target] } : {})); finishStep(true, st.answer ? "Correcto · " + st.answer : "Correcto: nada", st.why); return; }
  run.attempts++;
  if (sq) Board.setMarks({ bad: [sq] }); Board.shake();
  if (run.attempts < 2 && st.answer) { $("panel").className = "panel bad"; $("panel").innerHTML = '<div class="verdict"><h3>' + (sq ? "Esa no" : "Sí hay algo") + '</h3><p>Te queda un intento.</p></div>'; return; }
  Board.setMarks(st.answer ? { good: [st.answer], bad: sq ? [sq] : [], att: st.att || [] } : { bad: sq ? [sq] : [] });
  finishStep(false, st.answer ? "Era " + st.answer : "No había nada", st.why);
}
function judgeChoice(k, btn) {
  if (run.answered) return;
  const st = curStep(); const ok = k === st.answer;
  $("opts").querySelectorAll(".opt").forEach(b => { if (b === btn) b.classList.add(ok ? "ok" : "no"); });
  if (!ok) { Board.shake(); run.attempts++; }
  const it = curItem();
  Board.setMarks({ target: [it.target], att: st.att || [], def: st.def || [] });
  finishStep(ok, ok ? "Correcto" : "No", st.why + (st.att ? " Atacantes: " + st.att.length + " · defensores: " + (st.def || []).length + "." : ""));
}
function judgeMove(from, to) {
  if (run.answered) return;
  const st = curStep(); const it = curItem();
  const sol = st.sols.find(s => s.from === from && s.to === to);
  if (sol) {
    const ch = run.ch; let extra = null;
    if (ch) { const m = ch.move({ from, to, promotion: "q" }); if (m) extra = moveExtra(m); }
    Board.move(from, to, extra); Board.setMarks({ good: [from, to] }); beep("move");
    if (sol.reply) {
      // el rival responde y sigue otra pregunta
      finishStep(true, "Bien · " + sol.san, "Ahora responde " + sol.reply.san + ". Remata.", { noCount: true, then: () => {
        const R = run;
        setTimeout(() => {
          if (run !== R) return;
          const ch2 = run.ch; if (ch2) { ch2.move({ from: sol.reply.from, to: sol.reply.to, promotion: "q" }); }
          Board.animate(sol.reply.from, sol.reply.to, () => {
            if (run !== R) return;
            Board.move(sol.reply.from, sol.reply.to, null);
            run.extraSteps = curSteps().slice(0, run.step + 1).concat([{ kind: "move", ask: "Mate. ¿Cuál es la jugada?", sols: [sol.mate], why: st.why }]);
            run.step++; run.answered = false; run.attempts = 0; drillStep();
          });
        }, 500);
      } });
      return;
    }
    finishStep(true, "Correcto · " + sol.san, st.why); return;
  }
  run.attempts++; Board.shake(); Board.setMarks({ bad: [from, to].filter(Boolean) });
  const legal = run.ch ? run.ch.moves({ verbose: true }).find(m => m.from === from && m.to === to) : null;
  if (run.attempts < 2) { $("panel").className = "panel bad"; $("panel").innerHTML = '<div class="verdict"><h3>' + (legal ? "No es esa" : "Esa jugada no es legal") + "</h3><p>Te queda un intento.</p></div>"; return; }
  const s0 = st.sols[0];
  if (run.ch) { const m = run.ch.move({ from: s0.from, to: s0.to, promotion: "q" }); if (m) { Board.move(s0.from, s0.to, moveExtra(m)); } } else Board.move(s0.from, s0.to, null);
  Board.setMarks({ good: [s0.from, s0.to] });
  finishStep(false, "Era " + s0.san, st.why);
}
function moveExtra(m) {
  const ex = {};
  if (m.flags.includes("k")) ex.rook = m.color === "w" ? ["h1", "f1"] : ["h8", "f8"];
  if (m.flags.includes("q")) ex.rook = m.color === "w" ? ["a1", "d1"] : ["a8", "d8"];
  if (m.flags.includes("e")) ex.ep = m.to[0] + (m.color === "w" ? "5" : "4");

}
function deckFinish() {

}
SCREENS.deckdone = v => {

    (r.misses.length ? '<div class="card"><h3>Lo que fallaste</h3>' + r.misses.map(m => '<div class="miss"><b>' + esc(m.it.line || m.it.tag || "") + "</b>" + esc(m.why || "") + "</div>").join("") + "</div>" : "") +

/* ═══════════ RUNNER DE LÍNEAS (APERTURAS) ═══════════ */

  const my = op.color === "white" ? "w" : "b";

  go("line");
}
SCREENS.line = v => {

  header(L.surprise ? "Rival sorpresa" : op.name, { back: () => { if (session) { if (!confirm("¿Salir de la sesión de hoy?")) return; session = null; } line = null; go("aperturas"); }, meta: (L.mode === "guiado" ? "guiado" : L.mode === "tablero" ? "tablero" : "examen") + (session ? "  " + sessionClock() : "") });

    '<div class="board-foot"><span>Juegas con <b>' + (L.my === "w" ? "blancas" : "negras") + '</b>' + (L.surprise ? "" : ' · <span class="tiny">' + esc(L.br.name) + "</span>") + '</span><span class="mono" id="sheet"></span></div>' +
    '<div class="panel" id="panel"></div><div class="opts" id="opts"></div><div id="act"></div><div id="finish"></div>';

function lineSheet() {
  if (!line || !$("sheet")) return;
  const h = line.ch.history(); const out = []; for (let i = 0; i < h.length; i++) { if (i % 2 === 0) out.push(Math.floor(i / 2) + 1 + "."); out.push(h[i]); }
  $("sheet").textContent = out.slice(-6).join(" ");
  $("lprog").style.width = (line.idx / line.br.moves.length * 100) + "%";
}
function phaseOf(ch, my) {
  // señal real: rey enrocado, piezas menores fuera, torres conectadas
  const hist = ch.history({ verbose: true }); const castled = hist.some(m => m.color === my && /^O-O/.test(m.san));
  const b = ch.board(); const rank = my === "w" ? 7 : 0; const row = b[rank];
  const home = { b: [1, 6], n: [2, 5] }; let minors = 0;
  row.forEach((p, i) => { if (p && p.color === my && ((p.type === "n" && home.b.includes(i)) || (p.type === "b" && home.n.includes(i)))) minors++; });

/* ═══════════ ANÁLISIS DE PARTIDAS (v2.3) ═══════════ */
// Función autocontenida: solo depende de Chess. Se usa en el hilo principal, en el Worker y en los tests.
function makeAnalyzer(Chess) {
  const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
  const NAME = { p: "peón", n: "caballo", b: "alfil", r: "torre", q: "dama", k: "rey" };
  const key4 = fen => fen.split(" ").slice(0, 4).join(" ");
  const clean = s => String(s || "").replace(/[+#]/g, "");
  const seq = (sans) => { const o = []; for (let i = 0; i < sans.length; i++) { if (i % 2 === 0) o.push((i / 2 + 1) + "."); o.push(sans[i]); } return o.join(" "); };

  function buildTree(rep) {
    const T = { w: {}, b: {} };
    for (const o of rep) {
      const col = o.color === "white" ? "w" : "b"; const M = T[col];
      for (const br of o.branches) {
        const ch = new Chess(); const path = [];
        for (const m of br.moves) {
          const k = key4(ch.fen());
          const n = M[k] || (M[k] = { user: null, rival: [], brs: [], op: o.key, opName: o.name, mn: m.mn, seq: seq(path) });
          let cs = m.n; try { const mm = ch.move(m.n); if (mm) { cs = mm.san; ch.undo(); } } catch (e) {} if (m.isUser) n.user = cs; else if (!n.rival.includes(cs)) n.rival.push(cs);
          if (!n.brs.includes(br.id)) n.brs.push(br.id);
          ch.move(m.n); path.push(m.n);
        }
        const k = key4(ch.fen());
        const n = M[k] || (M[k] = { user: null, rival: [], brs: [], op: o.key, opName: o.name, mn: br.moves[br.moves.length - 1].mn, seq: seq(path), end: true });
        if (!n.brs.includes(br.id)) n.brs.push(br.id);
      }
    }
    return T;
  }

  // Intercambio estático: valor neto de la captura m para quien mueve (recapturas legales, la menos valiosa primero).
  function seeSq(ch, sq) {
    const caps = ch.moves({ verbose: true }).filter(m => m.to === sq && m.captured);
    if (!caps.length) return 0;
    caps.sort((a, b) => VAL[a.piece] - VAL[b.piece]);
    const m = caps[0]; const v = VAL[m.captured] + (m.promotion ? VAL[m.promotion] - 1 : 0);
    ch.move(m.san); const r = seeSq(ch, sq); ch.undo();
    return Math.max(0, v - r);
  }
  function see(ch, m) {
    const v = VAL[m.captured] + (m.promotion ? VAL[m.promotion] - 1 : 0);
    ch.move(m.san); const r = seeSq(ch, m.to); ch.undo();
    return v - r;
  }
  function bestCapture(ch) {
    let best = null;
    for (const m of ch.moves({ verbose: true })) { if (!m.captured) continue; const s = see(ch, m); if (!best || s > best.see) best = { m, see: s }; }
    return best;
  }
  function mateIn1(ch) { return ch.moves({ verbose: true }).find(m => m.san.endsWith("#")) || null; }
  function uciToSan(ch, uci) {
    if (!uci) return null;
    try { const m = ch.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || undefined }); if (!m) return null; ch.undo(); return m.san; } catch (e) { return null; }
  }
  function evalPov(a, my) {
    if (!a) return null;
    if (a.mate != null) return (a.mate > 0 ? 2000 : -2000) * (my === "w" ? 1 : -1);
    if (a.eval != null) return my === "w" ? a.eval : -a.eval;
    return null;
  }

  // g: partida en formato NDJSON de Lichess (pgnInJson). user: mi usuario en minúsculas. T: árbol.
  function analyzeGame(g, user, T) {
    const u = String(user || "").toLowerCase();
    const wn = ((g.players && g.players.white && g.players.white.user && g.players.white.user.name) || "").toLowerCase();
    const bn = ((g.players && g.players.black && g.players.black.user && g.players.black.user.name) || "").toLowerCase();
    const my = wn === u ? "w" : bn === u ? "b" : (g.myColor || "w");
    const mine = g.players && g.players[my === "w" ? "white" : "black"] || {};
    const opp = g.players && g.players[my === "w" ? "black" : "white"] || {};
    const sans = String(g.moves || "").trim().split(/\s+/).filter(Boolean);
    const an = Array.isArray(g.analysis) ? g.analysis : null;
    const clocks = Array.isArray(g.clocks) ? g.clocks : null;
    const init = g.clock && g.clock.initial != null ? g.clock.initial : null, inc = g.clock && g.clock.increment || 0;
    const result = g.winner ? (g.winner === (my === "w" ? "white" : "black") ? "g" : "p") : "e";
    const ch = new Chess();
    const M = T[my];
    const R = { id: g.id, t: g.createdAt || Date.now(), color: my, result, speed: g.speed || "", tc: init != null ? (init / 60) + "+" + inc : (g.speed || ""),
      ratingBefore: mine.rating != null ? mine.rating : null, ratingDiff: mine.ratingDiff != null ? mine.ratingDiff : null,
      ratingAfter: mine.rating != null && mine.ratingDiff != null ? mine.rating + mine.ratingDiff : null,
      opponent: (opp.user && opp.user.name) || "anónimo", oppRating: opp.rating != null ? opp.rating : null,
      status: g.status || "", timeout: g.status === "outoftime" && result === "p", abandon: g.status === "timeout",
      hasAnalysis: !!an, plies: sans.length, hung: 0, mateMissed: 0, mateAllowed: 0, freeMissed: 0, blunders: 0, mistakes: 0,
      timeLeft: null, time10: null, unconverted: false, maxEval: null, exit: null, branchIds: [], missing: null, events: [], src: "lichess", mate: false, miss: "ninguna", out: 0, branch: "" };
    let inTree = true, lastNode = M[key4(ch.fen())] || null, lastHang = null;
    let myClocks = [];
    for (let i = 0; i < sans.length; i++) {
      const san = sans[i]; const col = i % 2 === 0 ? "w" : "b"; const mn = Math.floor(i / 2) + 1;
      const fenP = ch.fen();
      // salida del árbol
      if (inTree) {
        const node = M[key4(fenP)];
        if (!node) inTree = false;
        else {
          lastNode = node;
          if ((col === my && !node.user) || (col !== my && !node.rival.length)) { inTree = false; R.treeEnd = mn; }
          else {
          const okMove = col === my ? node.user === clean(san) : node.rival.map(clean).includes(clean(san));
          if (!okMove) {
            inTree = false;
            R.exit = { ply: i + 1, mn, by: col === my ? "me" : "rival", played: san, expected: col === my ? node.user : node.rival.slice(), op: node.op, opName: node.opName, seq: node.seq, brs: node.brs.slice(), end: !!node.end };
            if (col !== my) R.missing = { key: node.op + "|" + node.seq + "|" + clean(san), op: node.op, opName: node.opName, seq: node.seq, move: san, mn };
          }
          }
        }
      }
      const legal = ch.moves({ verbose: true });
      const mv = legal.find(m => m.san === san) || legal.find(m => clean(m.san) === clean(san));
      if (!mv) { R.parseError = "jugada " + (i + 1) + ": " + san; break; }
      if (col === my) {
        const a = an && an[i] ? an[i] : null;
        const judged = a && a.judgment ? a.judgment.name : null;
        const ev = [];
        // c) tenía mate en 1
        const m1 = mateIn1(ch);
        if (m1 && !mv.san.endsWith("#")) ev.push({ rule: "c", cat: "mate", label: "Mate en 1 que no viste", best: m1.san, note: "Tenías mate en 1 con " + m1.san + " y jugaste " + san + "." });
        // d) captura gratis con SEE >= 3
        const bc = bestCapture(ch);
        const mySee = mv.captured ? see(ch, mv) : -99;
        if (!m1 && bc && bc.see >= 3 && !(mv.captured && mySee >= bc.see - 1)) ev.push({ rule: "d", cat: "gratis", label: "Material gratis que no comiste", best: bc.m.san, review: true, note: "Podías comer " + NAME[bc.m.captured] + " en " + bc.m.to + " con " + bc.m.san + " (ganas " + bc.see + ") y jugaste " + san + "." });
        ch.move(mv.san);
        // a) el rival tiene mate en 1
        const om = mateIn1(ch);
        if (om) ev.push({ rule: "a", cat: "mate", label: "Permitiste mate en 1", threat: om.san, threatTo: om.to, note: "Después de " + san + " el rival tiene mate con " + om.san + "." });
        // b) el rival gana material (intercambio estático >= 2)
        let hang = null;
        for (const m of ch.moves({ verbose: true })) {
          if (!m.captured) continue;
          const net = see(ch, m) - (m.to === mv.to && mv.captured ? VAL[mv.captured] : 0);
          if (net >= 2 && (!hang || net > hang.net)) hang = { m, net };
        }
        if (!om && hang && lastHang !== hang.m.to) ev.push({ rule: "b", cat: "suelta", label: "Pieza colgada", threat: hang.m.san, threatTo: hang.m.to, review: true, note: "Después de " + san + " el rival gana tu " + NAME[hang.m.captured] + " de " + hang.m.to + " con " + hang.m.san + " (neto " + hang.net + ")." });
        lastHang = hang ? hang.m.to : null;
        // con análisis de Lichess: sus juicios mandan
        let lichessBest = null;
        if (an) {
          if (a && a.best) { ch.undo(); lichessBest = uciToSan(ch, a.best); ch.move(mv.san); }
          if (judged === "Blunder") R.blunders++; else if (judged === "Mistake") R.mistakes++;
          const confirmed = judged === "Blunder" || judged === "Mistake";
          const kept = [];
          for (const e of ev) {
            if (e.rule === "b" || e.rule === "d") { if (!confirmed && judged !== "Inaccuracy") continue; e.review = false; }
            kept.push(e);
          }
          ev.length = 0; ev.push(...kept);
          if (confirmed && !ev.length) {
            const before = evalPov(an[i - 1], my), after = evalPov(a, my);
            ev.push({ rule: "L", cat: "tactica", label: judged === "Blunder" ? "Error grave (Lichess)" : "Error (Lichess)", best: lichessBest, note: (judged === "Blunder" ? "Error grave según Lichess. " : "Error según Lichess. ") + (lichessBest ? "Lo mejor era " + lichessBest + "." : "") + (before != null && after != null ? " La evaluación pasó de " + (before / 100).toFixed(1) + " a " + (after / 100).toFixed(1) + "." : "") });
          }
          if (lichessBest) for (const e of ev) if (!e.best) e.best = lichessBest;
        }
        for (const e of ev) {
          if (e.rule === "b") R.hung++; else if (e.rule === "c") R.mateMissed++; else if (e.rule === "a") R.mateAllowed++; else if (e.rule === "d") R.freeMissed++;
          e.gameId = g.id; e.ply = i + 1; e.mn = mn; e.color = my; e.fen = fenP; e.fenAfter = ch.fen(); e.played = san;
          e.id = "imp:" + g.id + ":" + (i + 1) + ":" + e.rule;
        }
        // una sola tarjeta por jugada: la de más peso
        const order = { a: 0, c: 1, L: 2, b: 3, d: 4 };
        ev.sort((x, y) => order[x.rule] - order[y.rule]);
        if (ev.length) { const top = ev[0]; if (ev.length > 1) top.note += " También: " + ev.slice(1).map(e => e.note).join(" "); R.events.push(top); }
        if (clocks && clocks[i] != null) myClocks.push(clocks[i]);
      } else {
        ch.move(mv.san);
      }
      if (an && an[i]) { const e = evalPov(an[i], my); if (e != null && (R.maxEval == null || e > R.maxEval)) R.maxEval = e; }
    }
    R.branchIds = R.exit ? R.exit.brs.slice() : lastNode ? lastNode.brs.slice() : [];
    if (R.branchIds.length === 1) R.branch = R.branchIds[0];
    R.exitOp = R.exit ? R.exit.op : lastNode ? lastNode.op : null;
    if (R.exit) { R.out = R.exit.by === "me" ? R.exit.mn : 0; R.exitMn = R.exit.mn; }
    if (myClocks.length) {
      R.timeLeft = Math.round(myClocks[myClocks.length - 1] / 100);
      const start = init != null ? init : Math.round(myClocks[0] / 100);
      const c10 = myClocks[Math.min(9, myClocks.length - 1)];
      R.time10 = Math.max(0, Math.round(start + inc * Math.min(10, myClocks.length) - c10 / 100));
    }
    if (an && R.maxEval != null && R.maxEval >= 300 && result !== "g") R.unconverted = true;
    R.mate = R.mateMissed > 0;
    R.lostByBlunder = result === "p" && (R.mateAllowed > 0 || R.hung > 0 || R.blunders > 0 || R.mateMissed > 0);
    R.url = "https://lichess.org/" + g.id + (my === "b" ? "/black" : "");
    return R;
  }

  return { buildTree, see, bestCapture, mateIn1, analyzeGame, key4, VAL, NAME };
}

function partidaItems(n) {

function worstMetric() {
  let gs = gamesWeek(); if (gs.length < 3) gs = gamesLast10();
  const m = metricsOf(gs); if (!m) return { k: "ninguno", why: "todavía no hay partidas importadas ni registradas", m: null };
  const c = [];
  c.push({ k: "colgadas", s: m.hung / GOALS.hung, why: "cuelgas " + (Math.round(m.hung * 10) / 10) + " piezas por partida (meta: 1 o menos)" });
  const mates = m.mateMissed + m.mateAllowed; c.push({ k: "mates", s: mates > 0 ? 1.5 + mates * 0.5 : 0, why: "se te escaparon " + mates + " mates en 1 (meta: 0)" });
  if (m.free != null) c.push({ k: "gratis", s: m.free / GOALS.free, why: "dejaste " + (Math.round(m.free * 10) / 10) + " piezas gratis sin comer por partida (meta: 1 o menos)" });
  c.push({ k: "apertura", s: m.n ? m.exitMe / m.n * 3 : 0, why: "saliste de tu apertura por error propio en " + m.exitMe + " de " + m.n + " partidas" });

  c.sort((x, y) => y.s - x.s);
  const top = c[0];

function lossStreakToday() {

  if (gs.length < 2) return false; const l = gs.slice(-2); return l[0].result === "p" && l[1].result === "p";
}
function realWeights(op) {
  // mezcla pesos estimados con la frecuencia real de las partidas importadas (mín. 10)
  const imp = impGames(); if (imp.length < 10) return null;
  const cnt = {}; let n = 0;
  for (const g of imp) { const brs = (g.branchIds || []).filter(id => op.branches.some(b => b.id === id)); if (!brs.length) continue; n++; brs.forEach(id => { cnt[id] = (cnt[id] || 0) + 1 / brs.length; }); }
  if (!n) return null;
  const alpha = Math.min(0.8, n / 30); const est = op.branches.reduce((a, b) => a + b.weight, 0);
  const out = {}; op.branches.forEach(b => { out[b.id] = (1 - alpha) * b.weight + alpha * ((cnt[b.id] || 0) / n) * est; });

}

pickBranch = function (op) {

  for (const b of op.branches) { r -= rw.w[b.id]; if (r <= 0) return b; } return op.branches[op.branches.length - 1];
};

function sessionPlan() {
  const w = worstMetric(); const od = openingOfDay(); const k = w.k;
  const P = (key, n) => ({ k: key, run: next => startDeck(key, { n, onDone: next }) });
  const line = key => ({ k: "line", run: next => startLine(key, { onDone: next }) });
  const partida = n => ({ k: "partida", run: next => startDeck("partida", { items: partidaItems(n), onDone: next }) });
  const remates = n => ({ k: "remates", run: next => { const r = Math.random(); startDeck(r < .5 ? "remates" : r < .75 ? "mate2" : "defiende", { n, onDone: next }); } });
  let parts;
  if (k === "colgadas") parts = [P("segura", 6), P("radar", 6), P("contar", 3), partida(3), line(od), remates(2)];
  else if (k === "mates") parts = [P("remates", 6), P("escaneo", 3), P("radar", 4), P("contar", 2), partida(3), line(od)];
  else if (k === "gratis") parts = [P("contar", 6), P("escaneo", 3), P("radar", 4), partida(3), line(od), remates(2)];
  else if (k === "apertura") { const worst = worstOpening() || od; parts = [line(od)].concat(worst !== od ? [line(worst)] : [{ k: "line2", run: next => startLine(od, { onDone: next }) }]).concat([P("radar", 4), P("contar", 3), partida(3), remates(2)]); }
  else parts = [P("radar", 6), P("contar", 4), partida(4), line(od), remates(3)];
  const errs = S.cards.filter(c => c.src === "imp").length || dueCards().length;
  if (errs) parts.unshift({ k: "errores", run: next => startReview({ onDone: next, withImported: true }) });
  return { focus: k, why: w.why, parts, timed: k === "tiempo", label: parts.map(p => ({ errores: "Errores", segura: "¿Es segura?", radar: "Radar", contar: "Contar", escaneo: "Escaneo", partida: "Como en partida", line: ALL_LINES[od].name, line2: "otra rama", remates: "Remates" })[p.k] || p.k).join(" · ") };
}
function worstOpening() {

}

  const r = _finishStep24d(ok, title, text, extra);
  try { const it = run && curItem(); if (it && it.vis && run.answered && !run.visPlayed) { run.visPlayed = true; clearTimeout(run.timer); const ch = new Chess(it.fen); let i = 0; const R = run;
    const step = () => { if (run !== R || i >= it.seq.length) { if (run === R && ok && S.set.auto) run.timer = setTimeout(() => { if (run && run.answered) advance(); }, 1200); return; } const m = ch.move(it.seq[i++]); if (!m) return; Board.animate(m.from, m.to, () => { if (run !== R) return; Board.move(m.from, m.to, moveExtra(m)); setTimeout(step, 350); }); };
    setTimeout(step, 500); } } catch (e) {}

const _sessionPlan24 = sessionPlan;
